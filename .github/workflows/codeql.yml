#
# CodeQL code scanning (advanced setup). Results appear in the repository's
# Security tab under "Code scanning". Do not also enable CodeQL "default setup"
# in the repository settings: GitHub rejects advanced-setup uploads while
# default setup is enabled.

name: CodeQL

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"   # weekly, Monday 04:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["python", "actions"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
